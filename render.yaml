services:
  - type: web
    name: alfauzan-sms-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alfauzan-sms-db
          property: connectionString

databases:
  - name: alfauzan-sms-db
    databaseName: alfauzan
    user: alfauzan
